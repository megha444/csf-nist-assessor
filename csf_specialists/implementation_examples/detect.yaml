DE.AE-02:
  name: Potentially adverse events are analyzed to better understand associated activities
  examples:
  - 'Ex1:  Use security information and event management (SIEM) or other tools to continuously monitor
    log events for known malicious and suspicious activity'
  - 'Ex2:  Utilize up-to-date cyber threat intelligence in log analysis tools to improve detection accuracy
    and characterize threat actors, their methods, and indicators of compromise'
  - 'Ex3:  Regularly conduct manual reviews of log events for technologies that cannot be sufficiently
    monitored through automation'
  - 'Ex4:  Use log analysis tools to generate reports on their findings'
DE.AE-03:
  name: Information is correlated from multiple sources
  examples:
  - 'Ex1:  Constantly transfer log data generated by other sources to a relatively small number of log
    servers'
  - 'Ex2:  Use event correlation technology (e.g., SIEM) to collect information captured by multiple sources'
  - 'Ex3:  Utilize cyber threat intelligence to help correlate events among log sources'
DE.AE-04:
  name: The estimated impact and scope of adverse events are understood
  examples:
  - 'Ex1:  Use SIEMs or other tools to estimate impact and scope, and review and refine the estimates'
  - 'Ex2:  A person creates their own estimates of impact and scope'
DE.AE-06:
  name: Information on adverse events is provided to authorized staff and tools
  examples:
  - 'Ex1:  Use cybersecurity software to generate alerts and provide them to the security operations center
    (SOC), incident responders, and incident response tools'
  - 'Ex2:  Incident responders and other authorized personnel can access log analysis findings at all
    times'
  - 'Ex3:  Automatically create and assign tickets in the organization’s ticketing system when certain
    types of alerts occur'
  - 'Ex4:  Manually create and assign tickets in the organization’s ticketing system when technical staff
    discover indicators of compromise'
DE.AE-07:
  name: Cyber threat intelligence and other contextual information are integrated into the analysis
  examples:
  - 'Ex1:  Securely provide cyber threat intelligence feeds to detection technologies, processes, and
    personnel'
  - 'Ex2:  Securely provide information from asset inventories to detection technologies, processes, and
    personnel'
  - 'Ex3:  Rapidly acquire and analyze vulnerability disclosures for the organization’s technologies from
    suppliers, vendors, and third-party security advisories'
DE.AE-08:
  name: Incidents are declared when adverse events meet the defined incident criteria
  examples:
  - 'Ex1:  Apply incident criteria to known and assumed characteristics of activity in order to determine
    whether an incident should be declared'
  - 'Ex2:  Take known false positives into account when applying incident criteria'
DE.CM-01:
  name: Networks and network services are monitored to find potentially adverse events
  examples:
  - 'Ex1:  Monitor DNS, BGP, and other network services for adverse events'
  - 'Ex2:  Monitor wired and wireless networks for connections from unauthorized endpoints'
  - 'Ex3:  Monitor facilities for unauthorized or rogue wireless networks'
  - 'Ex4:  Compare actual network flows against baselines to detect deviations'
  - 'Ex5:  Monitor network communications to identify changes in security postures for zero trust purposes'
DE.CM-02:
  name: The physical environment is monitored to find potentially adverse events
  examples:
  - 'Ex1:  Monitor logs from physical access control systems (e.g., badge readers) to find unusual access
    patterns (e.g., deviations from the norm) and failed access attempts'
  - 'Ex2:  Review and monitor physical access records (e.g., from visitor registration, sign-in sheets)'
  - 'Ex3:  Monitor physical access controls (e.g., locks, latches, hinge pins, alarms) for signs of tampering'
  - 'Ex4:  Monitor the physical environment using alarm systems, cameras, and security guards'
DE.CM-03:
  name: Personnel activity and technology usage are monitored to find potentially adverse events
  examples:
  - 'Ex1:  Use behavior analytics software to detect anomalous user activity to mitigate insider threats'
  - 'Ex2:  Monitor logs from logical access control systems to find unusual access patterns and failed
    access attempts'
  - 'Ex3:  Continuously monitor deception technology, including user accounts, for any usage'
DE.CM-06:
  name: External service provider activities and services are monitored to find potentially adverse events
  examples:
  - 'Ex1:  Monitor remote and onsite administration and maintenance activities that external providers
    perform on organizational systems'
  - 'Ex2:  Monitor activity from cloud-based services, internet service providers, and other service providers
    for deviations from expected behavior'
DE.CM-09:
  name: Computing hardware and software, runtime environments, and their data are monitored to find potentially
    adverse events
  examples:
  - 'Ex1:  Monitor email, web, file sharing, collaboration services, and other common attack vectors to
    detect malware, phishing, data leaks and exfiltration, and other adverse events'
  - 'Ex2:  Monitor authentication attempts to identify attacks against credentials and unauthorized credential
    reuse'
  - 'Ex3:  Monitor software configurations for deviations from security baselines'
  - 'Ex4: Monitor hardware and software for signs of tampering'
  - 'Ex5: Use technologies with a presence on endpoints to detect cyber health issues (e.g., missing patches,
    malware infections, unauthorized software), and redirect the endpoints to a remediation environment
    before access is authorized'
