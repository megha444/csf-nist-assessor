RC.CO-03:
  name: Recovery activities and progress in restoring operational capabilities are communicated to designated
    internal and external stakeholders
  examples:
  - 'Ex1:  Securely share recovery information, including restoration progress, consistent with response
    plans and information sharing agreements'
  - 'Ex2:  Regularly update senior leadership on recovery status and restoration progress for major incidents'
  - 'Ex3:  Follow the rules and protocols defined in contracts for incident information sharing between
    the organization and its suppliers'
  - 'Ex4:  Coordinate crisis communication between the organization and its critical suppliers'
RC.CO-04:
  name: Public updates on incident recovery are shared using approved methods and messaging
  examples:
  - 'Ex1:  Follow the organization’s breach notification procedures for recovering from a data breach
    incident'
  - 'Ex2:  Explain the steps being taken to recover from the incident and to prevent a recurrence'
RC.RP-01:
  name: The recovery portion of the incident response plan is executed once initiated from the incident
    response process
  examples:
  - 'Ex1:  Begin recovery procedures during or after incident response processes'
  - 'Ex2:  Make all individuals with recovery responsibilities aware of the plans for recovery and the
    authorizations required to implement each aspect of the plans'
RC.RP-02:
  name: Recovery actions are selected, scoped, prioritized, and performed
  examples:
  - 'Ex1:  Select recovery actions based on the criteria defined in the incident response plan and available
    resources'
  - 'Ex2:  Change planned recovery actions based on a reassessment of organizational needs and resources'
RC.RP-03:
  name: The integrity of backups and other restoration assets is verified before using them for restoration
  examples:
  - 'Ex1:  Check restoration assets for indicators of compromise, file corruption, and other integrity
    issues before use'
RC.RP-04:
  name: Critical mission functions and cybersecurity risk management are considered to establish post-incident
    operational norms
  examples:
  - 'Ex1:  Use business impact and system categorization records (including service delivery objectives)
    to validate that essential services are restored in the appropriate order'
  - 'Ex2:  Work with system owners to confirm the successful restoration of systems and the return to
    normal operations'
  - 'Ex3:  Monitor the performance of restored systems to verify the adequacy of the restoration'
RC.RP-05:
  name: The integrity of restored assets is verified, systems and services are restored, and normal operating
    status is confirmed
  examples:
  - 'Ex1:  Check restored assets for indicators of compromise and remediation of root causes of the incident
    before production use'
  - 'Ex2:  Verify the correctness and adequacy of the restoration actions taken before putting a restored
    system online'
RC.RP-06:
  name: The end of incident recovery is declared based on criteria, and incident-related documentation
    is completed
  examples:
  - 'Ex1:  Prepare an after-action report that documents the incident itself, the response and recovery
    actions taken, and lessons learned'
  - 'Ex2:  Declare the end of incident recovery once the criteria are met'
