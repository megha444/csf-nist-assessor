ID.AM-01:
  name: Inventories of hardware managed by the organization are maintained
  examples:
  - 'Ex1:  Maintain inventories for all types of hardware, including IT, IoT, OT, and mobile devices'
  - 'Ex2:  Constantly monitor networks to detect new hardware and automatically update inventories'
ID.AM-02:
  name: Inventories of software, services, and systems managed by the organization are maintained
  examples:
  - 'Ex1:  Maintain inventories for all types of software and services, including commercial-off-the-shelf,
    open-source, custom applications, API services, and cloud-based applications and services'
  - 'Ex2:  Constantly monitor all platforms, including containers and virtual machines, for software and
    service inventory changes'
  - 'Ex3:  Maintain an inventory of the organization’s systems'
ID.AM-03:
  name: Representations of the organization’s authorized network communication and internal and external
    network data flows are maintained
  examples:
  - 'Ex1:  Maintain baselines of communication and data flows within the organization’s wired and wireless
    networks'
  - 'Ex2:  Maintain baselines of communication and data flows between the organization and third parties'
  - 'Ex3: Maintain baselines of communication and data flows for the organization’s infrastructure-as-a-service
    (IaaS) usage'
  - 'Ex4:  Maintain documentation of expected network ports, protocols, and services that are typically
    used among authorized systems'
ID.AM-04:
  name: Inventories of services provided by suppliers are maintained
  examples:
  - 'Ex1:  Inventory all external services used by the organization, including third-party infrastructure-as-a-service
    (IaaS), platform-as-a-service (PaaS), and software-as-a-service (SaaS) offerings; APIs; and other
    externally hosted application services'
  - 'Ex2:  Update the inventory when a new external service is going to be utilized to ensure adequate
    cybersecurity risk management monitoring of the organization’s use of that service'
ID.AM-05:
  name: Assets are prioritized based on classification, criticality, resources, and impact on the mission
  examples:
  - 'Ex1:  Define criteria for prioritizing each class of assets'
  - 'Ex2:  Apply the prioritization criteria to assets'
  - 'Ex3:  Track the asset priorities and update them periodically or when significant changes to the
    organization occur'
ID.AM-07:
  name: Inventories of data and corresponding metadata for designated data types are maintained
  examples:
  - 'Ex1:  Maintain a list of the designated data types of interest (e.g., personally identifiable information,
    protected health information, financial account numbers, organization intellectual property, operational
    technology data)'
  - 'Ex2:  Continuously discover and analyze ad hoc data to identify new instances of designated data
    types'
  - 'Ex3:  Assign data classifications to designated data types through tags or labels'
  - 'Ex4:  Track the provenance, data owner, and geolocation of each instance of designated data types'
ID.AM-08:
  name: Systems, hardware, software, services, and data are managed throughout their life cycles
  examples:
  - 'Ex1:  Integrate cybersecurity considerations throughout the life cycles of systems, hardware, software,
    and services'
  - 'Ex2:  Integrate cybersecurity considerations into product life cycles'
  - 'Ex3:  Identify unofficial uses of technology to meet mission objectives (i.e., “shadow IT”)'
  - 'Ex4:  Periodically identify redundant systems, hardware, software, and services that unnecessarily
    increase the organization’s attack surface'
  - 'Ex5:  Properly configure and secure systems, hardware, software, and services prior to their deployment
    in production'
  - 'Ex6:  Update inventories when systems, hardware, software, and services are moved or transferred
    within the organization'
  - 'Ex7:  Securely destroy stored data based on the organization’s data retention policy using the prescribed
    destruction method, and keep and manage a record of the destructions'
  - 'Ex8:  Securely sanitize data storage when hardware is being retired, decommissioned, reassigned,
    or sent for repairs or replacement'
  - 'Ex9:  Offer methods for destroying paper, storage media, and other physical forms of data storage'
ID.IM-01:
  name: Improvements are identified from evaluations
  examples:
  - 'Ex1:  Perform self-assessments of critical services that take current threats and TTPs into consideration'
  - 'Ex2:  Invest in third-party assessments or independent audits of the effectiveness of the organization’s
    cybersecurity program to identify areas that need improvement'
  - 'Ex3:  Constantly evaluate compliance with selected cybersecurity requirements through automated means'
ID.IM-02:
  name: Improvements are identified from security tests and exercises, including those done in coordination
    with suppliers and relevant third parties
  examples:
  - 'Ex1:  Identify improvements for future incident response activities based on findings from incident
    response assessments (e.g., tabletop exercises and simulations, tests, internal reviews, independent
    audits)'
  - 'Ex2:  Identify improvements for future business continuity, disaster recovery, and incident response
    activities based on exercises performed in coordination with critical service providers and product
    suppliers'
  - 'Ex3:  Involve internal stakeholders (e.g., senior executives, legal department, HR) in security tests
    and exercises as appropriate'
  - 'Ex4:  Perform penetration testing to identify opportunities to improve the security posture of selected
    high-risk systems as approved by leadership'
  - 'Ex5:  Exercise contingency plans for responding to and recovering from the discovery that products
    or services did not originate with the contracted supplier or partner or were altered before receipt'
  - 'Ex6:  Collect and analyze performance metrics using security tools and services to inform improvements
    to the cybersecurity program'
ID.IM-03:
  name: Improvements are identified from execution of operational processes, procedures, and activities
  examples:
  - 'Ex1:  Conduct collaborative lessons learned sessions with suppliers'
  - 'Ex2:  Annually review cybersecurity policies, processes, and procedures to take lessons learned into
    account'
  - 'Ex3:  Use metrics to assess operational cybersecurity performance over time'
ID.IM-04:
  name: Incident response plans and other cybersecurity plans that affect operations are established,
    communicated, maintained, and improved
  examples:
  - 'Ex1:  Establish contingency plans (e.g., incident response, business continuity, disaster recovery)
    for responding to and recovering from adverse events that can interfere with operations, expose confidential
    information, or otherwise endanger the organization’s mission and viability'
  - 'Ex2:  Include contact and communication information, processes for handling common scenarios, and
    criteria for prioritization, escalation, and elevation in all contingency plans'
  - 'Ex3:  Create a vulnerability management plan to identify and assess all types of vulnerabilities
    and to prioritize, test, and implement risk responses'
  - 'Ex4:  Communicate cybersecurity plans (including updates) to those responsible for carrying them
    out and to affected parties'
  - 'Ex5:  Review and update all cybersecurity plans annually or when a need for significant improvements
    is identified'
ID.RA-01:
  name: Vulnerabilities in assets are identified, validated, and recorded
  examples:
  - 'Ex1:  Use vulnerability management technologies to identify unpatched and misconfigured software'
  - 'Ex2:  Assess network and system architectures for design and implementation weaknesses that affect
    cybersecurity'
  - 'Ex3:  Review, analyze, or test organization-developed software to identify design, coding, and default
    configuration vulnerabilities'
  - 'Ex4:  Assess facilities that house critical computing assets for physical vulnerabilities and resilience
    issues'
  - 'Ex5:  Monitor sources of cyber threat intelligence for information on new vulnerabilities in products
    and services'
  - 'Ex6:  Review processes and procedures for weaknesses that could be exploited to affect cybersecurity'
ID.RA-02:
  name: Cyber threat intelligence is received from information sharing forums and sources
  examples:
  - 'Ex1:  Configure cybersecurity tools and technologies with detection or response capabilities to securely
    ingest cyber threat intelligence feeds'
  - 'Ex2:  Receive and review advisories from reputable third parties on current threat actors and their
    tactics, techniques, and procedures (TTPs)'
  - 'Ex3:  Monitor sources of cyber threat intelligence for information on the types of vulnerabilities
    that emerging technologies may have'
ID.RA-03:
  name: Internal and external threats to the organization are identified and recorded
  examples:
  - 'Ex1:  Use cyber threat intelligence to maintain awareness of the types of threat actors likely to
    target the organization and the TTPs they are likely to use'
  - 'Ex2:  Perform threat hunting to look for signs of threat actors within the environment'
  - 'Ex3:  Implement processes for identifying internal threat actors'
ID.RA-04:
  name: Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded
  examples:
  - 'Ex1:  Business leaders and cybersecurity risk management practitioners work together to estimate
    the likelihood and impact of risk scenarios and record them in risk registers'
  - 'Ex2:  Enumerate the potential business impacts of unauthorized access to the organization’s communications,
    systems, and data processed in or by those systems'
  - 'Ex3:  Account for the potential impacts of cascading failures for systems of systems'
ID.RA-05:
  name: Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform
    risk response prioritization
  examples:
  - 'Ex1:  Develop threat models to better understand risks to the data and identify appropriate risk
    responses'
  - 'Ex2:  Prioritize cybersecurity resource allocations and investments based on estimated likelihoods
    and impacts'
ID.RA-06:
  name: Risk responses are chosen, prioritized, planned, tracked, and communicated
  examples:
  - 'Ex1:  Apply the vulnerability management plan’s criteria for deciding whether to accept, transfer,
    mitigate, or avoid risk'
  - 'Ex2:  Apply the vulnerability management plan’s criteria for selecting compensating controls to mitigate
    risk'
  - 'Ex3:  Track the progress of risk response implementation (e.g., plan of action and milestones [POA&M],
    risk register, risk detail report)'
  - 'Ex4:  Use risk assessment findings to inform risk response decisions and actions'
  - 'Ex5:  Communicate planned risk responses to affected stakeholders in priority order'
ID.RA-07:
  name: Changes and exceptions are managed, assessed for risk impact, recorded, and tracked
  examples:
  - 'Ex1:  Implement and follow procedures for the formal documentation, review, testing, and approval
    of proposed changes and requested exceptions'
  - 'Ex2:  Document the possible risks of making or not making each proposed change, and provide guidance
    on rolling back changes'
  - 'Ex3:  Document the risks related to each requested exception and the plan for responding to those
    risks'
  - 'Ex4:  Periodically review risks that were accepted based upon planned future actions or milestones'
ID.RA-08:
  name: Processes for receiving, analyzing, and responding to vulnerability disclosures are established
  examples:
  - 'Ex1:  Conduct vulnerability information sharing between the organization and its suppliers following
    the rules and protocols defined in contracts'
  - 'Ex2:  Assign responsibilities and verify the execution of procedures for processing, analyzing the
    impact of, and responding to cybersecurity threat, vulnerability, or incident disclosures by suppliers,
    customers, partners, and government cybersecurity organizations'
ID.RA-09:
  name: The authenticity and integrity of hardware and software are assessed prior to acquisition and
    use
  examples:
  - 'Ex1:  Assess the authenticity and cybersecurity of critical technology products and services prior
    to acquisition and use'
ID.RA-10:
  name: Critical suppliers are assessed prior to acquisition
  examples:
  - 'Ex1:  Conduct supplier risk assessments against business and applicable cybersecurity requirements,
    including the supply chain'
