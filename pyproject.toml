[tool.poetry]
package-mode = false
name = "csf-assessor"
version = "0.1.0"
description = "CSF Assessor Fleet"
authors = ["Megha Agarwal"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
google-adk = "^2.6.3"
fastapi = "*"
uvicorn = "*"
pydantic = "*"
pydantic-settings = "*"
qdrant-client = "~1.16.0"
python-dotenv = "*"
google-genai = "*"
google-cloud-firestore = "*"
google-cloud-storage = "^2.18"
google-cloud-aiplatform = "*"
python-docx = "*"
tiktoken = "*"
python-multipart = "*"
aiofiles = "*"
httpx = "*"
openpyxl = "^3.1.5"
google-cloud-pubsub = "^2.39.1"
python-pptx = "^1.0.2"
jinja2 = "^3.1.6"
plotly = "^6.9.0"
streamlit = "^1.61.1"
opentelemetry-exporter-gcp-trace = "^1.15.0"
google-cloud-run = "^0.16.1"
google-cloud-modelarmor = "*"
reportlab = "^5.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
